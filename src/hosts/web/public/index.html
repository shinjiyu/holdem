<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>holdem 大厅</title>
  <style>
    :root { color-scheme: dark; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #0b1a12; color: #e8f5e9; }
    main { max-width: 1100px; margin: 0 auto; padding: 1rem; }
    button { margin: 0.2rem; padding: 0.45rem 0.8rem; border-radius: 6px; border: 0; cursor: pointer; }
    button.primary { background: #2e7d32; color: #fff; }
    button.act { background: #1b5e20; color: #fff; }
    button.warn { background: #ef6c00; color: #fff; }
    button.ghost { background: #24352a; color: #c8e6c9; }
    .card { background: #12261a; border: 1px solid #2e4a38; border-radius: 10px; padding: 0.75rem 1rem; margin: 0.75rem 0; }
    .muted { color: #9ccc9c; font-size: 0.9rem; }
    #error { color: #ff8a80; white-space: pre-wrap; }
    .row { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
    .me-avatar { width: 40px; height: 40px; border-radius: 50%; background: #1b3a28; object-fit: cover; }
    .seat { width: 88px; text-align: center; border: 1px dashed #2e4a38; border-radius: 8px; padding: 0.4rem; cursor: pointer; }
    .seat.filled { border-style: solid; background: #163222; cursor: default; }
    .seat.empty:hover { border-color: #66bb6a; }
    .seat .name { font-size: 0.7rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .seat img { width: 40px; height: 40px; border-radius: 50%; background: #1b3a28; object-fit: cover; }
    .tables { display: grid; gap: 0.75rem; }
    .table-card h3 { margin: 0 0 0.5rem; }
    .seats { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .hidden { display: none !important; }
    .hosted .act { opacity: 0.35; pointer-events: none; }

    /* —— oval felt —— */
    #table.table-wrap { background: transparent; border: 0; padding: 0; }
    .table-toolbar { margin-bottom: 0.5rem; }
    .felt {
      position: relative;
      width: min(100%, 980px);
      margin: 0.5rem auto 1rem;
      aspect-ratio: 16 / 10;
      min-height: 420px;
      background:
        radial-gradient(ellipse at 50% 45%, #2e7d32 0%, #1b5e20 42%, #0f3d1a 78%, #0a2812 100%);
      border: 12px solid #4e342e;
      border-radius: 50% / 44%;
      box-shadow:
        inset 0 0 60px rgba(0, 0, 0, 0.45),
        0 12px 28px rgba(0, 0, 0, 0.35);
    }
    .felt-rail {
      position: absolute;
      inset: 18px;
      border: 2px solid rgba(200, 230, 201, 0.12);
      border-radius: 50% / 44%;
      pointer-events: none;
    }
    .felt-center {
      position: absolute;
      left: 50%;
      top: 46%;
      transform: translate(-50%, -50%);
      text-align: center;
      min-width: 220px;
      max-width: 70%;
    }
    .felt-street {
      font-size: 0.8rem;
      color: #a5d6a7;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 0.35rem;
    }
    .felt-board {
      display: flex;
      justify-content: center;
      gap: 0.35rem;
      flex-wrap: wrap;
      min-height: 52px;
      margin-bottom: 0.4rem;
    }
    .felt-pot {
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff9c4;
    }
    .felt-pot small { display: block; font-weight: 400; color: #c8e6c9; font-size: 0.8rem; margin-top: 0.15rem; }

    .felt-settle {
      display: none;
      margin-top: 0.55rem;
      padding: 0.55rem 0.75rem 0.65rem;
      border-radius: 12px;
      background: rgba(8, 20, 12, 0.88);
      border: 1px solid rgba(255, 213, 79, 0.55);
      box-shadow: 0 0 0 1px rgba(255, 213, 79, 0.15), 0 8px 24px rgba(0,0,0,.35);
      min-width: 200px;
    }
    .felt-settle.show { display: block; }
    .felt-settle .settle-title {
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      color: #ffe082;
      margin-bottom: 0.35rem;
    }
    .felt-settle .settle-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      margin: 0.25rem 0;
      font-size: 0.95rem;
      font-weight: 700;
      color: #fffde7;
    }
    .felt-settle .settle-row img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      background: #1b3a28;
    }
    .felt-settle .settle-amt {
      color: #ffd54f;
      font-variant-numeric: tabular-nums;
    }
    .felt-settle .settle-sub {
      margin-top: 0.3rem;
      font-size: 0.75rem;
      color: #a5d6a7;
      font-weight: 400;
    }

    .felt-seat.winner .bubble {
      border-color: #ffd54f;
      box-shadow: 0 0 0 2px rgba(255, 213, 79, 0.45), 0 4px 14px rgba(0,0,0,.4);
    }
    .felt-seat.winner .tag {
      background: #f9a825;
      color: #212121;
    }
    .felt-seat .win-amt {
      margin-top: 0.2rem;
      font-size: 0.75rem;
      font-weight: 700;
      color: #ffd54f;
    }

    .pcard {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 52px;
      border-radius: 5px;
      background: #fafafa;
      color: #111;
      font-weight: 700;
      font-size: 0.8rem;
      box-shadow: 0 2px 4px rgba(0,0,0,.35);
      font-variant-numeric: tabular-nums;
    }
    .pcard.red { color: #c62828; }
    .pcard.empty {
      background: rgba(0,0,0,.2);
      color: transparent;
      border: 1px dashed rgba(255,255,255,.25);
      box-shadow: none;
    }

    .felt-seat {
      position: absolute;
      width: 118px;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 2;
    }
    /* 6 seats around the oval: top → clockwise */
    .felt-seat[data-i="0"] { left: 50%; top: 7%; }
    .felt-seat[data-i="1"] { left: 88%; top: 28%; }
    .felt-seat[data-i="2"] { left: 88%; top: 72%; }
    .felt-seat[data-i="3"] { left: 50%; top: 93%; }
    .felt-seat[data-i="4"] { left: 12%; top: 72%; }
    .felt-seat[data-i="5"] { left: 12%; top: 28%; }

    .felt-seat .bubble {
      background: rgba(10, 28, 18, 0.88);
      border: 2px solid #3e5c48;
      border-radius: 12px;
      padding: 0.4rem 0.35rem 0.45rem;
      box-shadow: 0 4px 12px rgba(0,0,0,.35);
    }
    .felt-seat.filled .bubble { border-color: #66bb6a; }
    .felt-seat.you .bubble {
      border-color: #ffd54f;
      box-shadow: 0 0 0 2px rgba(255, 213, 79, 0.35), 0 4px 12px rgba(0,0,0,.35);
    }
    .felt-seat.empty .bubble {
      border-style: dashed;
      opacity: 0.55;
      background: rgba(10, 28, 18, 0.45);
    }
    .felt-seat img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      background: #1b3a28;
      display: block;
      margin: 0 auto 0.25rem;
    }
    .felt-seat .name {
      font-size: 0.72rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .felt-seat .stack {
      font-size: 0.7rem;
      color: #fff9c4;
      margin-top: 0.15rem;
    }
    .felt-seat .bet-chip {
      margin-top: 0.25rem;
      display: inline-block;
      min-width: 2.2rem;
      padding: 0.1rem 0.4rem;
      border-radius: 999px;
      background: #c62828;
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .felt-seat .bet-chip.zero { visibility: hidden; }
    .felt-seat .hole-mini {
      display: flex;
      justify-content: center;
      gap: 0.2rem;
      margin-top: 0.3rem;
    }
    .felt-seat .hole-mini .pcard {
      width: 28px;
      height: 38px;
      font-size: 0.7rem;
    }
    .felt-seat .tag {
      position: absolute;
      top: -8px;
      right: -4px;
      font-size: 0.65rem;
      background: #37474f;
      color: #eceff1;
      padding: 1px 5px;
      border-radius: 8px;
    }
    .felt-seat.actor .bubble {
      border-color: #4fc3f7;
      box-shadow: 0 0 0 2px rgba(79, 195, 247, 0.4), 0 4px 12px rgba(0,0,0,.35);
    }
    .felt-seat.actor .tag { background: #0288d1; color: #fff; }
    #turnHint { text-align: center; margin: 0.35rem 0 0.6rem; font-size: 0.95rem; color: #ffe082; min-height: 1.2em; }


    .actions-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      justify-content: center;
      align-items: center;
      padding: 0.75rem;
      background: #12261a;
      border: 1px solid #2e4a38;
      border-radius: 10px;
    }
    #result {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: #ffe082;
      text-align: center;
    }

    @media (max-width: 720px) {
      .felt { min-height: 360px; border-width: 8px; }
      .felt-seat { width: 96px; }
      .felt-seat img { width: 36px; height: 36px; }
      .pcard { width: 30px; height: 42px; font-size: 0.75rem; }
    }
  </style>
</head>
<body>
<main>
  <h1>holdem 大厅</h1>
  <p class="muted">先 GitHub 登录 → 大厅选桌入座 → 开打。加星领币在登录条。</p>

  <div id="auth" class="card">检查登录…</div>

  <section id="lobby" class="hidden">
    <div class="card row">
      <button class="primary" id="btnCreate">创建新桌</button>
      <button class="ghost" id="btnRefresh">刷新大厅</button>
      <span class="muted" id="lobbyHint"></span>
    </div>
    <div id="tables" class="tables"></div>
  </section>

  <section id="table" class="table-wrap hidden">
    <div class="row table-toolbar card">
      <button class="ghost" id="btnBack">← 回大厅（离桌）</button>
      <button class="ghost" id="btnToken">复制 AI 令牌</button>
      <strong id="tableTitle"></strong>
      <span class="muted" id="status"></span>
    </div>
    <div class="felt" id="felt">
      <div class="felt-rail"></div>
      <div class="felt-center">
        <div class="felt-street" id="streetLabel">—</div>
        <div class="felt-board" id="board"></div>
        <div class="felt-pot" id="pot">底池 —</div>
        <div class="felt-settle" id="settleBanner"></div>
      </div>
      <!-- seats injected -->
    </div>
    <div id="turnHint"></div>
    <div class="actions-bar" id="actions"></div>
  </section>

  <pre id="error"></pre>
</main>
<script>
  const BASE = location.pathname.startsWith('/holdem') ? '/holdem' : '';
  const $ = (id) => document.getElementById(id);
  let me = null;
  let viewMode = 'lobby'; // lobby | table
  let lastView = null;

  function showErr(e) { $('error').textContent = e || ''; }

  async function api(path, opts) {
    const res = await fetch(BASE + path, {
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      ...opts,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || res.statusText);
    return data;
  }

  function rankGlyph(rank) {
    return rank === 'T' ? '10' : (rank || '?');
  }

  function suitGlyph(suit) {
    const map = { c: '♣', d: '♦', h: '♥', s: '♠', '♣': '♣', '♦': '♦', '♥': '♥', '♠': '♠' };
    return map[suit] || suit || '';
  }

  function suitRed(suit) {
    const g = suitGlyph(suit);
    return g === '♥' || g === '♦' || suit === 'h' || suit === 'd';
  }

  function cardEl(c) {
    const el = document.createElement('span');
    el.className = 'pcard' + (suitRed(c.suit) ? ' red' : '');
    el.textContent = rankGlyph(c.rank) + suitGlyph(c.suit);
    return el;
  }

  function emptyCard() {
    const el = document.createElement('span');
    el.className = 'pcard empty';
    el.textContent = '?';
    return el;
  }

  function renderAuth() {
    const auth = $('auth');
    if (!me || !me.loggedIn) {
      auth.innerHTML = `<p>未登录</p><a href="${BASE}/login"><button class="primary">用 GitHub 登录</button></a>`;
      return;
    }
    const claimed = me.starClaimed
      ? '<span class="muted">已领过加星奖励</span>'
      : me.needsReauth
        ? `<a href="${BASE}/login"><button class="warn">重新登录后才能领币</button></a>`
        : `<button class="warn" id="btnStar">我已 star ${me.starGrantRepo}，领 ${me.starGrantChips} 币</button>`;
    auth.innerHTML = `
      <div class="row">
        <img class="me-avatar" src="${me.avatarUrl}" alt="" />
        <div>
          <div><strong>@${me.githubLogin}</strong></div>
          <div class="muted">筹码：${me.chips}</div>
        </div>
        ${claimed}
        <a class="muted" href="https://github.com/${me.starGrantRepo}" target="_blank" rel="noopener">去加星 ↗</a>
        <button class="ghost" id="btnLogout">退出</button>
      </div>`;
    const btn = $('btnStar');
    if (btn) btn.onclick = () => claimStar().catch((e) => showErr(e.message));
    const lo = $('btnLogout');
    if (lo) lo.onclick = () => logout().catch((e) => showErr(e.message));
  }

  async function logout() {
    await api('/api/logout', { method: 'POST', body: '{}' });
    location.href = BASE + '/';
  }

  async function claimStar() {
    showErr('');
    try {
      const r = await api('/api/star-claim', { method: 'POST', body: '{}' });
      me.chips = r.chips;
      me.starClaimed = true;
      me.needsReauth = false;
      renderAuth();
      alert(`到账 +${r.granted}`);
    } catch (e) {
      const msg = e instanceof Error ? e.message : String(e);
      showErr(msg);
      if (/重新登录|reauth|access token/i.test(msg)) {
        if (confirm(msg + '\n\n现在去重新登录？')) location.href = BASE + '/login';
      }
    }
  }

  function renderLobby(tables) {
    viewMode = 'lobby';
    $('lobby').classList.remove('hidden');
    $('table').classList.add('hidden');
    $('lobbyHint').textContent = `共 ${tables.length} 桌 · 点空座位入座`;
    const box = $('tables');
    box.innerHTML = '';
    for (const t of tables) {
      const el = document.createElement('div');
      el.className = 'card table-card';
      el.innerHTML = `<h3>${t.name} <span class="muted">#${t.id} · ${t.occupied}/${t.maxSeats}</span></h3>`;
      const seats = document.createElement('div');
      seats.className = 'seats';
      for (const s of t.seats) {
        const seat = document.createElement('div');
        seat.className = 'seat ' + (s.githubLogin ? 'filled' : 'empty');
        if (s.githubLogin) {
          seat.innerHTML = `<img src="${s.avatarUrl}" alt=""/><div class="name">@${s.githubLogin}</div><div class="muted">#${s.seat}</div>`;
        } else {
          seat.innerHTML = `<div style="height:40px;line-height:40px">空</div><div class="name">座位 ${s.seat}</div>`;
          seat.onclick = () => joinTable(t.id, s.seat).catch((e) => showErr(e.message));
        }
        seats.appendChild(seat);
      }
      el.appendChild(seats);
      box.appendChild(el);
    }
  }

  async function refreshLobby() {
    showErr('');
    const data = await api('/api/lobby');
    renderLobby(data.tables || []);
  }

  async function joinTable(tableId, seat) {
    showErr('');
    await api(`/api/tables/${tableId}/join`, {
      method: 'POST',
      body: JSON.stringify({ seat }),
    });
    me = await api('/api/me');
    renderAuth();
    await enterTable();
  }

  async function createTable() {
    const name = prompt('桌子名称', '友谊桌');
    if (name == null) return;
    await api('/api/tables', { method: 'POST', body: JSON.stringify({ name }) });
    await refreshLobby();
  }

  async function leaveTable() {
    if (!me?.tableId) {
      await refreshLobby();
      return;
    }
    await api(`/api/tables/${me.tableId}/leave`, { method: 'POST', body: '{}' });
    me = await api('/api/me');
    renderAuth();
    await refreshLobby();
  }

  function ensureFeltSeats() {
    const felt = $('felt');
    if (felt.querySelector('.felt-seat')) return;
    for (let i = 0; i < 6; i++) {
      const el = document.createElement('div');
      el.className = 'felt-seat empty';
      el.dataset.i = String(i);
      el.innerHTML = `<div class="bubble"><div class="name">空 #${i}</div></div>`;
      felt.appendChild(el);
    }
  }

  function actionLabel(a) {
    const map = {
      fold: '弃牌',
      check: '过牌',
      call: '跟注',
      bet: '下注',
      raise: '加注',
      allin: '全下',
    };
    const name = map[a.kind] || a.kind;
    if (a.kind === 'bet' || a.kind === 'raise') {
      return `${name} ${a.min ?? ''}`;
    }
    if (a.kind === 'call' && lastView?.view?.toCall) {
      return `${name} ${lastView.view.toCall}`;
    }
    return name;
  }

  function renderFelt(payload) {
    ensureFeltSeats();
    const v = payload.view;
    const mySeat = v?.seat;
    const seats = payload.seats || [];
    const actor = v?.actorsSeat;
    const result = payload.result;
    const winnerMap = new Map((result?.winners || []).map((w) => [w.seat, w.amount]));
    const settled = Boolean(result?.winners?.length);

    $('streetLabel').textContent = settled ? 'SHOWDOWN' : (v?.street || 'waiting');
    const board = $('board');
    board.innerHTML = '';
    const cards = v?.board || [];
    if (cards.length === 0) {
      for (let i = 0; i < 5; i++) board.appendChild(emptyCard());
    } else {
      for (const c of cards) board.appendChild(cardEl(c));
    }

    const potEl = $('pot');
    if (settled) {
      potEl.innerHTML = `底池已结算<small>共 ${v?.pot ?? result.winners.reduce((n, w) => n + w.amount, 0)}</small>`;
    } else {
      potEl.innerHTML =
        `底池 ${v?.pot ?? 0}<small>跟注 ${v?.toCall ?? 0}` +
        (payload.streetBet != null ? ` · 本街注 ${payload.streetBet}` : '') +
        `</small>`;
    }

    renderSettleBanner(payload);

    for (let i = 0; i < 6; i++) {
      const el = $('felt').querySelector(`.felt-seat[data-i="${i}"]`);
      if (!el) continue;
      const s = seats.find((x) => x.seat === i) || { seat: i, githubLogin: null, avatarUrl: null, streetBet: 0 };
      const isYou = mySeat === i;
      const isActor = !settled && actor === i;
      const winAmt = winnerMap.get(i);
      const isWinner = winAmt != null;
      el.className = 'felt-seat'
        + (s.githubLogin ? ' filled' : ' empty')
        + (isYou ? ' you' : '')
        + (isActor ? ' actor' : '')
        + (isWinner ? ' winner' : '');
      let tagText = `#${i}`;
      if (isWinner) tagText = '胜';
      else if (isYou) tagText = '你';
      else if (isActor) tagText = '行动';
      const tag = `<span class="tag">${tagText}</span>`;
      const bet = Number(s.streetBet) || 0;
      const betHtml = settled
        ? ''
        : `<div class="bet-chip${bet > 0 ? '' : ' zero'}">${bet}</div>`;
      if (s.githubLogin) {
        const shown = (result?.shown || []).find((x) => x.seat === i);
        const holeCards = isYou ? (v?.hole || []) : (shown?.hole || []);
        const holeHtml = holeCards.length ? '<div class="hole-mini"></div>' : '';
        const stackTxt = isYou && v?.stack != null
          ? `<div class="stack">剩余 ${v.stack}</div>`
          : '';
        const winHtml = isWinner ? `<div class="win-amt">+${winAmt}</div>` : '';
        el.innerHTML = `${tag}<div class="bubble">
          <img src="${s.avatarUrl}" alt=""/>
          <div class="name">@${s.githubLogin}</div>
          ${stackTxt}
          ${winHtml}
          ${betHtml}
          ${holeHtml}
        </div>`;
        if (holeCards.length) {
          const mini = el.querySelector('.hole-mini');
          for (const c of holeCards) mini.appendChild(cardEl(c));
        }
      } else {
        el.innerHTML = `${tag}<div class="bubble"><div class="name">空位</div>${betHtml}</div>`;
      }
    }
  }

  function renderSettleBanner(payload) {
    const banner = $('settleBanner');
    const result = payload.result;
    if (!result?.winners?.length) {
      banner.classList.remove('show');
      banner.innerHTML = '';
      return;
    }
    const seats = payload.seats || [];
    const rows = result.winners.map((w) => {
      const who = seats.find((s) => s.seat === w.seat);
      const name = who?.githubLogin ? `@${who.githubLogin}` : `#${w.seat}`;
      const av = who?.avatarUrl
        ? `<img src="${who.avatarUrl}" alt=""/>`
        : '';
      return `<div class="settle-row">${av}<span>${name}</span><span class="settle-amt">+${w.amount}</span></div>`;
    }).join('');
    banner.innerHTML =
      `<div class="settle-title">摊牌结算</div>${rows}` +
      `<div class="settle-sub">底牌已翻开 · 可再开一手</div>`;
    banner.classList.add('show');
  }

  function renderView(payload) {
    const v = payload.view;
    if (!v) return;
    lastView = payload;
    $('tableTitle').textContent = `桌 ${payload.tableId || me.tableId || ''}`;
    $('status').textContent = `@${v.you.githubLogin} · seat ${v.seat}`;
    renderFelt(payload);
    updateTurnHint(payload);

    const handActive = payload.handActive ?? (v.actorsSeat != null);
    const myTurn = handActive && v.actorsSeat === v.seat;

    const box = $('actions');
    box.innerHTML = '';

    if (!handActive) {
      const start = document.createElement('button');
      start.className = 'primary';
      start.textContent = '开一手';
      start.onclick = () => api('/api/start', { method: 'POST', body: '{}' }).then(refreshTable).catch((e) => showErr(e.message));
      box.appendChild(start);
    }

    if (myTurn) {
      for (const a of (payload.legal || v.legal || [])) {
        const b = document.createElement('button');
        b.className = 'act';
        b.textContent = actionLabel(a);
        b.onclick = () => api('/api/act', {
          method: 'POST',
          body: JSON.stringify({ intent: { kind: a.kind, amount: a.min } }),
        }).then(refreshTable).catch((e) => showErr(e.message));
        box.appendChild(b);
      }
    }
  }

  function formatResult(result) {
    if (!result?.winners?.length) return '本手结束，可再开一手';
    const parts = result.winners.map((w) => {
      const who = (lastView?.seats || []).find((s) => s.seat === w.seat);
      const name = who?.githubLogin ? `@${who.githubLogin}` : `#${w.seat}`;
      return `${name} +${w.amount}`;
    });
    return `摊牌结算：${parts.join('，')}`;
  }

  function secondsLeft(deadlineMs) {
    if (deadlineMs == null) return null;
    return Math.max(0, Math.ceil((deadlineMs - Date.now()) / 1000));
  }

  function updateTurnHint(payload) {
    const v = payload?.view;
    const hint = $('turnHint');
    if (!v) { hint.textContent = ''; return; }
    const handActive = payload.handActive ?? (v.actorsSeat != null);
    const myTurn = handActive && v.actorsSeat === v.seat;
    const sec = secondsLeft(v.actionDeadlineMs);
    const clock = sec != null ? ` · ${sec}s` : '';
    if (!handActive) {
      hint.textContent = payload.result ? '可再开一手' : '人齐后点「开一手」';
      return;
    }
    if (myTurn) {
      hint.textContent = `轮到你行动${clock}（超时将自动过牌，不能过则弃牌）`;
      return;
    }
    if (v.actorsSeat != null) {
      const who = (payload.seats || []).find((s) => s.seat === v.actorsSeat);
      hint.textContent = who?.githubLogin
        ? `等待 @${who.githubLogin} 行动${clock}`
        : `等待座位 #${v.actorsSeat}${clock}`;
      return;
    }
    hint.textContent = '';
  }

  async function refreshTable() {
    showErr('');
    const data = await api('/api/view');
    renderView(data);
  }

  async function enterTable() {
    viewMode = 'table';
    $('lobby').classList.add('hidden');
    $('table').classList.remove('hidden');
    await refreshTable();
  }

  async function boot() {
    showErr('');
    me = await api('/api/me');
    renderAuth();
    if (!me.loggedIn) {
      $('lobby').classList.add('hidden');
      $('table').classList.add('hidden');
      return;
    }
    if (me.tableId != null) await enterTable();
    else await refreshLobby();
  }

  $('btnCreate').onclick = () => createTable().catch((e) => showErr(e.message));
  $('btnRefresh').onclick = () => refreshLobby().catch((e) => showErr(e.message));
  $('btnBack').onclick = () => leaveTable().catch((e) => showErr(e.message));
  $('btnToken').onclick = () => {
    api('/api/agent/token', { method: 'POST', body: '{}' })
      .then(async (t) => {
        const text = JSON.stringify({
          baseUrl: t.baseUrl,
          githubLogin: t.githubLogin,
          tableId: t.tableId,
          seat: t.seat,
          token: t.token,
        }, null, 2);
        await navigator.clipboard.writeText(text);
        alert('已复制桌令牌 JSON，可贴到 DSH / 配置里使用');
      })
      .catch((e) => showErr(e.message));
  };
  boot().catch((e) => showErr(e.message));
  setInterval(() => {
    if (!me?.loggedIn) return;
    if (viewMode === 'lobby') refreshLobby().catch(() => {});
    else refreshTable().catch(() => {});
    api('/api/me').then((m) => { me = m; renderAuth(); }).catch(() => {});
  }, 2000);
  setInterval(() => {
    if (viewMode === 'table' && lastView) updateTurnHint(lastView);
  }, 250);
</script>
</body>
</html>
